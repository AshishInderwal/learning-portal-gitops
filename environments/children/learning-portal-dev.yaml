apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: learning-portal-dev
  namespace: argocd
spec:
  project: default

  source:
    repoURL: https://github.com/AshishInderwal/learning-portal-gitops.git
    targetRevision: HEAD
    path: apps/learning-portal
    helm:
      valueFiles:
        - values-dev.yaml

  destination:
    server: https://kubernetes.default.svc
    namespace: learning-portal-dev

  syncPolicy:
    syncOptions:
      - CreateNamespace=true
